name: Release

# Baut ein sauberes Plugin-ZIP und hängt es an ein GitHub-Release. Genau
# dieses ZIP zieht sich die Update-Prüfung im WordPress-Backend
# (plugin-update-checker).
#
# Auslöser:
#  - Push nach main: Ist die „Version:“ im Plugin-Header neu (es gibt noch
#    keinen Tag v<Version>), werden Tag und Release automatisch angelegt.
#    Ein Merge mit hochgezählter Version reicht also für ein Update.
#  - Push eines Versions-Tags (z. B. v0.2.0) wie bisher.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: version
        run: |
          HDR=$(grep -oE '^\s*\*\s*Version:\s*.+' vereinsplugin/vereinsplugin.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d ' \r')
          echo "Header-Version: $HDR"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "$HDR" != "${GITHUB_REF_NAME#v}" ]; then
              echo "::error::Version im Plugin-Header ($HDR) passt nicht zum Tag (${GITHUB_REF_NAME}). Bitte 'Version:' in vereinsplugin/vereinsplugin.php und 'VP_VERSION' anpassen."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$HDR" >/dev/null; then
            echo "Tag v$HDR gibt es schon – kein neues Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$HDR" >> "$GITHUB_OUTPUT"

      - name: ZIP bauen
        if: steps.version.outputs.release == 'true'
        run: |
          mkdir -p build
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.zip' \
            vereinsplugin/ build/vereinsplugin/
          cd build
          zip -qr "../vereinsplugin.zip" vereinsplugin
          cd ..
          unzip -l vereinsplugin.zip | tail -5

      - name: Release veröffentlichen
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Vereinsplugin ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: vereinsplugin.zip
